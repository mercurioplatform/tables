<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="mercurioplatform/tables — animated demo">
  <title>mercurioplatform/tables</title>
  <desc>Animated preview: Laravel admin table with saved views, sortable columns, pulsing status badges and a bulk-action bar.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c222b"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- top-left brand -->
  <g transform="translate(40 38)">
    <circle cx="10" cy="10" r="6" fill="url(#accent)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#e6edf3">mercurioplatform/tables</text>
    <text x="28" y="34" font-family="ui-sans-serif, system-ui, -apple-system" font-size="12" fill="#7d8590">Reusable list/table engine for Laravel admin · Bootstrap 5 + Blade + jQuery</text>
  </g>

  <!-- window dots -->
  <g transform="translate(1100 30)">
    <circle cx="0" cy="10" r="5" fill="#f85149"/>
    <circle cx="18" cy="10" r="5" fill="#d29922"/>
    <circle cx="36" cy="10" r="5" fill="#3fb950"/>
  </g>

  <!-- saved-views tabs -->
  <g transform="translate(40 92)" font-family="ui-sans-serif, system-ui, -apple-system" font-size="12">
    <g>
      <rect x="0" y="0" width="78" height="28" rx="14" fill="#1f6feb"/>
      <text x="16" y="18" fill="#ffffff" font-weight="600">All</text>
      <text x="56" y="18" fill="#bcd9ff">36</text>
    </g>
    <g transform="translate(90 0)">
      <rect x="0" y="0" width="146" height="28" rx="14" fill="#1c222b" stroke="#2d333b"/>
      <circle cx="14" cy="14" r="4" fill="#3fb950"/>
      <text x="26" y="18" fill="#e6edf3">Published</text>
      <text x="120" y="18" fill="#7d8590">30</text>
    </g>
    <g transform="translate(248 0)">
      <rect x="0" y="0" width="98" height="28" rx="14" fill="#1c222b" stroke="#2d333b"/>
      <circle cx="14" cy="14" r="4" fill="#d29922"/>
      <text x="26" y="18" fill="#e6edf3">Draft</text>
      <text x="80" y="18" fill="#7d8590">5</text>
    </g>
    <g transform="translate(358 0)" opacity="0.7">
      <rect x="0" y="0" width="34" height="28" rx="14" fill="none" stroke="#2d333b" stroke-dasharray="3 3"/>
      <text x="13" y="20" fill="#7d8590" font-weight="700">+</text>
    </g>
  </g>

  <!-- search + chips -->
  <g transform="translate(40 138)" font-family="ui-sans-serif, system-ui, -apple-system" font-size="12">
    <rect x="0" y="0" width="280" height="30" rx="6" fill="#0d1117" stroke="#2d333b"/>
    <g transform="translate(12 9)" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round">
      <circle cx="5" cy="5" r="4.5"/>
      <line x1="8.5" y1="8.5" x2="12.5" y2="12.5"/>
    </g>
    <text x="34" y="20" fill="#7d8590">Поиск товаров…</text>

    <g transform="translate(296 0)">
      <rect x="0" y="0" width="74" height="30" rx="6" fill="#161b22" stroke="#2d333b"/>
      <text x="37" y="20" text-anchor="middle" fill="#7d8590">+ Бренд</text>
    </g>
    <g transform="translate(380 0)">
      <rect x="0" y="0" width="68" height="30" rx="6" fill="#161b22" stroke="#2d333b"/>
      <text x="34" y="20" text-anchor="middle" fill="#7d8590">+ Цена</text>
    </g>
    <g transform="translate(458 0)">
      <rect x="0" y="0" width="92" height="30" rx="6" fill="#161b22" stroke="#2d333b"/>
      <text x="46" y="20" text-anchor="middle" fill="#7d8590">+ Остаток</text>
    </g>

    <g transform="translate(792 0)">
      <rect x="0" y="0" width="160" height="30" rx="6" fill="#161b22" stroke="#2d333b"/>
      <g transform="translate(14 9)" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round">
        <line x1="0" y1="3" x2="14" y2="3"/>
        <line x1="2" y1="8" x2="12" y2="8"/>
        <line x1="5" y1="13" x2="9" y2="13"/>
      </g>
      <text x="38" y="20" fill="#e6edf3">Расширенный фильтр</text>
    </g>

    <g transform="translate(960 0)">
      <rect x="0" y="0" width="92" height="30" rx="6" fill="#161b22" stroke="#2d333b"/>
      <g transform="translate(14 8)" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 0 V9 M3 6 L7 10 L11 6"/>
        <line x1="1" y1="14" x2="13" y2="14"/>
      </g>
      <text x="34" y="20" fill="#e6edf3">Экспорт</text>
    </g>

    <g transform="translate(1060 0)">
      <rect x="0" y="0" width="32" height="30" rx="6" fill="#161b22" stroke="#2d333b"/>
      <g transform="translate(10 9)" fill="none" stroke="#7d8590" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2"/>
        <path d="M6 0 V2 M6 10 V12 M0 6 H2 M10 6 H12 M1.5 1.5 L3 3 M9 9 L10.5 10.5 M10.5 1.5 L9 3 M3 9 L1.5 10.5"/>
      </g>
    </g>
  </g>

  <!-- table header -->
  <g transform="translate(40 188)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#7d8590">
    <rect width="1120" height="36" rx="6" fill="#1c222b"/>
    <text x="22" y="22">#</text>
    <text x="84" y="22">TITLE</text>
    <g transform="translate(76 0)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.55;0.6;0.65" dur="6s" repeatCount="indefinite"/>
      <text x="40" y="22" fill="#388bfd">↑</text>
    </g>
    <text x="540" y="22">BRAND</text>
    <text x="730" y="22">PRICE</text>
    <text x="880" y="22">STOCK</text>
    <text x="980" y="22">STATUS</text>
  </g>

  <!-- rows -->
  <g transform="translate(40 232)" font-family="ui-sans-serif, system-ui, -apple-system" font-size="13">
    <!-- row 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;0 0;0 0;0 0" keyTimes="0;0.1;0.85;1" dur="6s" repeatCount="indefinite" additive="sum"/>
      <rect width="1120" height="32" rx="4" fill="url(#row)"/>
      <rect x="0" y="0" width="3" height="32" rx="2" fill="#1f6feb"/>
      <text x="22" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">36</text>
      <text x="84" y="20" fill="#e6edf3" font-weight="600">Chicco Hoopla развивающий мяч</text>
      <text x="540" y="20" fill="#a5d6ff">Childhome</text>
      <text x="730" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">38 000 ₽</text>
      <g transform="translate(880 8)">
        <rect width="64" height="14" rx="7" fill="#21262d"/>
        <rect width="58" height="14" rx="7" fill="#1f6feb" opacity="0.85"/>
        <text x="68" y="11" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7d8590">30</text>
      </g>
      <g transform="translate(980 6)">
        <rect width="92" height="20" rx="10" fill="#1c222b" stroke="#2d333b"/>
        <circle cx="14" cy="10" r="4" fill="#d29922">
          <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="14" fill="#e6edf3" font-size="11">Черновик</text>
      </g>
    </g>

    <!-- row 2 -->
    <g transform="translate(0 38)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.06;0.16;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-12 38;-12 38;0 38;0 38;0 38" keyTimes="0;0.06;0.18;0.85;1" dur="6s" repeatCount="indefinite"/>
      <rect width="1120" height="32" rx="4" fill="url(#row)"/>
      <text x="22" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">35</text>
      <text x="84" y="20" fill="#e6edf3" font-weight="600">Childhome пеленальный столик</text>
      <text x="540" y="20" fill="#a5d6ff">Childhome</text>
      <text x="730" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">12 900 ₽</text>
      <g transform="translate(880 8)">
        <rect width="64" height="14" rx="7" fill="#21262d"/>
        <rect width="6" height="14" rx="3" fill="#f85149" opacity="0.85"/>
        <text x="68" y="11" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7d8590">3</text>
      </g>
      <g transform="translate(980 6)">
        <rect width="92" height="20" rx="10" fill="#1c222b" stroke="#2d333b"/>
        <circle cx="14" cy="10" r="4" fill="#d29922"/>
        <text x="26" y="14" fill="#e6edf3" font-size="11">Черновик</text>
      </g>
    </g>

    <!-- row 3 -->
    <g transform="translate(0 76)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.13;0.24;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-12 76;-12 76;0 76;0 76;0 76" keyTimes="0;0.13;0.26;0.85;1" dur="6s" repeatCount="indefinite"/>
      <rect width="1120" height="32" rx="4" fill="url(#row)"/>
      <text x="22" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">33</text>
      <text x="84" y="20" fill="#e6edf3" font-weight="600">Bugaboo Bee комплект для новорождённого</text>
      <text x="540" y="20" fill="#a5d6ff">Bugaboo</text>
      <text x="730" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">18 900 ₽</text>
      <g transform="translate(880 8)">
        <rect width="64" height="14" rx="7" fill="#21262d"/>
        <rect width="12" height="14" rx="3" fill="#d29922" opacity="0.85"/>
        <text x="68" y="11" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7d8590">6</text>
      </g>
      <g transform="translate(980 6)">
        <rect width="100" height="20" rx="10" fill="#0c2d6b"/>
        <circle cx="14" cy="10" r="4" fill="#3fb950">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="14" fill="#bcd9ff" font-size="11">Опубликован</text>
      </g>
    </g>

    <!-- row 4 -->
    <g transform="translate(0 114)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.2;0.32;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-12 114;-12 114;0 114;0 114;0 114" keyTimes="0;0.2;0.34;0.85;1" dur="6s" repeatCount="indefinite"/>
      <rect width="1120" height="32" rx="4" fill="url(#row)"/>
      <text x="22" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">32</text>
      <text x="84" y="20" fill="#e6edf3" font-weight="600">Stokke Xplory X коляска</text>
      <text x="540" y="20" fill="#a5d6ff">Stokke</text>
      <text x="730" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">99 900 ₽</text>
      <g transform="translate(880 8)">
        <rect width="64" height="14" rx="7" fill="#21262d"/>
        <rect width="60" height="14" rx="7" fill="#3fb950" opacity="0.85"/>
        <text x="68" y="11" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7d8590">42</text>
      </g>
      <g transform="translate(980 6)">
        <rect width="100" height="20" rx="10" fill="#0c2d6b"/>
        <circle cx="14" cy="10" r="4" fill="#3fb950"/>
        <text x="26" y="14" fill="#bcd9ff" font-size="11">Опубликован</text>
      </g>
    </g>

    <!-- row 5 -->
    <g transform="translate(0 152)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.27;0.4;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-12 152;-12 152;0 152;0 152;0 152" keyTimes="0;0.27;0.42;0.85;1" dur="6s" repeatCount="indefinite"/>
      <rect width="1120" height="32" rx="4" fill="url(#row)"/>
      <text x="22" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">29</text>
      <text x="84" y="20" fill="#e6edf3" font-weight="600">Ergobaby Omni Breeze</text>
      <text x="540" y="20" fill="#a5d6ff">Ergobaby</text>
      <text x="730" y="20" font-family="ui-monospace, Menlo, monospace" fill="#e6edf3">19 900 ₽</text>
      <g transform="translate(880 8)">
        <rect width="64" height="14" rx="7" fill="#21262d"/>
        <rect width="22" height="14" rx="3" fill="#d29922" opacity="0.85"/>
        <text x="68" y="11" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7d8590">12</text>
      </g>
      <g transform="translate(980 6)">
        <rect width="100" height="20" rx="10" fill="#0c2d6b"/>
        <circle cx="14" cy="10" r="4" fill="#3fb950"/>
        <text x="26" y="14" fill="#bcd9ff" font-size="11">Опубликован</text>
      </g>
    </g>
  </g>

  <!-- bulk-bar (slides up at the end of the cycle) -->
  <g transform="translate(250 432)" font-family="ui-sans-serif, system-ui, -apple-system" font-size="12" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0.95;0" keyTimes="0;0.62;0.7;0.92;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="250 448;250 448;250 432;250 432;250 448" keyTimes="0;0.62;0.72;0.92;1" dur="6s" repeatCount="indefinite"/>
    <rect width="700" height="36" rx="18" fill="#161b22" stroke="#388bfd"/>
    <text x="20" y="22" fill="#e6edf3" font-weight="600">3 selected</text>
    <line x1="98" y1="10" x2="98" y2="26" stroke="#2d333b"/>

    <!-- Опубликовать -->
    <g transform="translate(112 11)" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 7 L5 11 L13 2"/>
    </g>
    <text x="132" y="22" fill="#3fb950">Опубликовать</text>

    <!-- Изменить цену (pencil) -->
    <g transform="translate(238 11)" fill="#e6edf3" stroke="none">
      <path d="M0 14 L0 11 L9 2 L12 5 L3 14 Z"/>
      <path d="M10 1 L11 0 L14 3 L13 4 Z"/>
    </g>
    <text x="258" y="22" fill="#e6edf3">Изменить цену</text>
    <line x1="354" y1="10" x2="354" y2="26" stroke="#2d333b"/>

    <!-- Сменить бренд (swap arrows) -->
    <g transform="translate(368 11)" fill="none" stroke="#e6edf3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 4 H14 L11 1"/>
      <path d="M14 11 H0 L3 14"/>
    </g>
    <text x="388" y="22" fill="#e6edf3">Сменить бренд</text>

    <!-- Удалить (trash) -->
    <g transform="translate(498 10)" fill="none" stroke="#f85149" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 4 H13"/>
      <path d="M5 4 V2 H9 V4"/>
      <path d="M2.5 4 L3.5 15 H10.5 L11.5 4"/>
      <path d="M5.5 7 V12 M8.5 7 V12"/>
    </g>
    <text x="518" y="22" fill="#f85149">Удалить</text>

    <!-- close × -->
    <g transform="translate(672 12)" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="12" y2="12"/>
      <line x1="12" y1="0" x2="0" y2="12"/>
    </g>
  </g>
</svg>
